spring:
  autoconfigure:
    exclude: []
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/social_notifications}
    username: ${DB_USERNAME:social_notifications}
    password: ${DB_PASSWORD:social_notifications}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:3000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
